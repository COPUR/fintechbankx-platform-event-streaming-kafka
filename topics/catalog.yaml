# FinTechBankX topic catalog: the single source of truth for evt.* topics.
#
# Status: Proposed (Event Platform Squad review required; each owning squad
# confirms its namespace). Nothing here says a topic exists on a cluster.
#
# Everything under topics/generated/ and deploy/strimzi/generated/ is rendered
# from this file by `npm run catalog:generate`; `npm test` fails if they drift.
#
# Rules enforced by scripts/catalog/catalog.mjs:
#   - topic name  evt.<ctx>.<aggregate>.<event>.v<major>
#   - DLQ name    evt.<ctx>.<aggregate>.dlq.v<major>   (one per namespace and major)
#   - a namespace is owned by exactly one service, and that service's
#     event_namespace in topics/registry/repository-bootstrap-manifest.csv
#     must equal the namespace (the owner is the only allowed producer)
#   - consumer groups are cg.<consumer-service-id>.<purpose>.v<major>
#   - DLQs are consumer-owned (ADR-019): a consumer dead-letters into
#     <its own namespace>.dlq.v<major>; only that namespace's service may
#     write it
#   - event topics are immutable facts: cleanup.policy=delete, never compact
#   - min.insync.replicas < replication factor, so one broker or zone can fail
#
# Sources:
#   - channels: asyncapi/<service-id>.yaml in
#     fintechbankx-governance-api-contracts-asyncapi-catalog (Proposed contracts)
#   - producers: the service repositories' outbox envelope factories
#     (<Ctx>EventEnvelopeFactory, Proposed branches) or legacy adapters
#   - consumers: no fintechbankx service repository contains a Kafka consumer
#     (@KafkaListener, KafkaConsumer) on any branch scanned on 2026-10-08, so
#     every consumer list below is empty and marked unknown. Add a consumer only
#     with a code or config reference.
apiVersion: catalog.fintechbankx.io/v1alpha1
kind: TopicCatalog
metadata:
  name: fintechbankx-events
  status: Proposed
  owner: svc-evt-streaming
  owningSquad: Event Platform Squad
  manifest: topics/registry/repository-bootstrap-manifest.csv

cluster:
  # Strimzi (in-cluster, non-AWS and local). AWS uses Amazon MSK, see deploy/msk.
  strimziClusterName: fintechbankx
  strimziNamespace: kafka

defaults:
  partitions: 3
  replicationFactor: 3
  minInsyncReplicas: 2
  cleanupPolicy: delete
  retentionMs: 604800000        # 7 days
  maxMessageBytes: 1048576      # 1 MiB
  dlq:                          # per-namespace override: namespaces[].dlq.{partitions,retentionMs}
    partitions: 3
    retentionMs: 1209600000     # 14 days

# Runtime identity of every service that produces or consumes a catalog topic.
# eventNamespace must equal the bootstrap manifest; it is where the service
# produces and where its consumer-owned DLQ lives (ADR-019).
# k8sNamespace and serviceAccount follow the platform contract; they become the
# IRSA subject (MSK) and the KafkaUser labels (Strimzi).
services:
  svc-ln-loan-lifecycle:
    eventNamespace: evt.ln.loan
    k8sNamespace: lending
    serviceAccount: loan-lifecycle-service
  svc-pay-initiation-settlement:
    eventNamespace: evt.pay.payment
    k8sNamespace: payments
    serviceAccount: payment-initiation-settlement-service
  svc-pay-bulk-orchestration:
    eventNamespace: evt.pay.bulk
    k8sNamespace: payments
    serviceAccount: payment-bulk-orchestration-service   # confirmed by the service thread
  svc-pay-request-to-pay:
    eventNamespace: evt.pay.rtp
    k8sNamespace: payments
    serviceAccount: payment-request-to-pay-service   # confirmed by the service thread
  svc-of-consent-authorization:
    eventNamespace: evt.of.consent
    k8sNamespace: open-finance
    serviceAccount: consent-authorization-service
  svc-of-payee-verification:
    eventNamespace: evt.of.payee
    k8sNamespace: open-finance
    serviceAccount: payee-verification-service
  svc-of-personal-financial-data:
    eventNamespace: evt.of.account
    k8sNamespace: open-finance
    serviceAccount: personal-financial-data-service
  svc-of-business-financial-data:
    eventNamespace: evt.of.corporate
    k8sNamespace: open-finance
    serviceAccount: business-financial-data-service
  svc-of-banking-metadata:
    eventNamespace: evt.of.metadata
    k8sNamespace: open-finance
    serviceAccount: banking-metadata-service
  svc-cus-profile-kyc:
    eventNamespace: evt.cus.customer
    k8sNamespace: customer
    serviceAccount: customer-profile-kyc-service
  svc-rsk-decisioning:
    eventNamespace: evt.rsk.risk
    k8sNamespace: risk
    serviceAccount: risk-decisioning-service
  svc-cmp-evidence:
    eventNamespace: evt.cmp.compliance
    k8sNamespace: compliance
    serviceAccount: compliance-evidence-service

namespaces:
  - namespace: evt.ln.loan
    owner: svc-ln-loan-lifecycle
    aggregate: Loan
    contract: asyncapi/svc-ln-loan-lifecycle.yaml
    implementation: outbox-relay
    implementationEvidence: >-
      fintechbankx-lendingpayments-loan-lifecycle-core, loan-infrastructure
      LoanEventEnvelopeFactory + OutboxRelay (Proposed branch, not merged).
    consumersStatus: unknown
    consumers: []
    topics:
      - {event: created, major: 1, eventType: Lending.Loan.Created.v1}
      - {event: approved, major: 1, eventType: Lending.Loan.Approved.v1}
      - {event: rejected, major: 1, eventType: Lending.Loan.Rejected.v1}
      - {event: disbursed, major: 1, eventType: Lending.Loan.Disbursed.v1}
      - {event: cancelled, major: 1, eventType: Lending.Loan.Cancelled.v1}
      - {event: payment-made, major: 1, eventType: Lending.Loan.PaymentMade.v1}
      - {event: fully-paid, major: 1, eventType: Lending.Loan.FullyPaid.v1}

  - namespace: evt.pay.payment
    owner: svc-pay-initiation-settlement
    aggregate: Payment
    contract: asyncapi/svc-pay-initiation-settlement.yaml
    implementation: outbox-relay
    implementationEvidence: >-
      fintechbankx-lendingpayments-payment-orchestration-initiation-settlement,
      payment-infrastructure PaymentEventEnvelopeFactory + OutboxRelay
      (Proposed branch, not merged).
    consumersStatus: known
    consumers:
      - service: svc-ln-loan-lifecycle
        group: cg.svc-ln-loan-lifecycle.loan-repayment-allocation.v1
        topics: [evt.pay.payment.loan-payment-completed.v1]
        dlq: evt.ln.loan.dlq.v1   # consumer-owned DLQ (ADR-019)
        evidence: >-
          Confirmed by the loan-lifecycle service thread on 2026-10-08
          (repayment allocation listener, in progress); not yet in code on
          the scanned branches.
    topics:
      - {event: created, major: 1, eventType: Payments.Payment.Created.v1}
      - {event: processing-started, major: 1, eventType: Payments.Payment.ProcessingStarted.v1}
      - {event: completed, major: 1, eventType: Payments.Payment.Completed.v1}
      - {event: failed, major: 1, eventType: Payments.Payment.Failed.v1}
      - {event: cancelled, major: 1, eventType: Payments.Payment.Cancelled.v1}
      - {event: refunded, major: 1, eventType: Payments.Payment.Refunded.v1}
      - {event: loan-payment-created, major: 1, eventType: Payments.Payment.LoanPaymentCreated.v1}
      - {event: loan-payment-completed, major: 1, eventType: Payments.Payment.LoanPaymentCompleted.v1}
      - {event: loan-payment-failed, major: 1, eventType: Payments.Payment.LoanPaymentFailed.v1}

  - namespace: evt.pay.rtp
    owner: svc-pay-request-to-pay
    aggregate: PayRequest
    contract: asyncapi/svc-pay-request-to-pay.yaml
    implementation: outbox-relay
    implementationEvidence: >-
      Outbox relay in progress (confirmed by the request-to-pay service
      thread on 2026-10-08). On main, KafkaPayRequestNotificationAdapter still
      publishes all three events to the legacy topic rtp.pay_requests.v1
      without the envelope; that topic is retired after the dual-publish
      steps in docs/architecture/TOPIC_NAMING_MIGRATION.md (see gaps).
    # No consumers: confirmed by the request-to-pay service thread 2026-10-08.
    consumersStatus: unknown
    consumers: []
    topics:
      - {event: created, major: 1, eventType: Payments.PayRequest.Created.v1}
      - {event: accepted, major: 1, eventType: Payments.PayRequest.Accepted.v1}
      - {event: rejected, major: 1, eventType: Payments.PayRequest.Rejected.v1}

  - namespace: evt.pay.bulk
    owner: svc-pay-bulk-orchestration
    aggregate: BulkFile
    contract: asyncapi/svc-pay-bulk-orchestration.yaml
    implementation: outbox-relay
    implementationEvidence: >-
      Outbox relay in fintechbankx-lendingpayments-payment-orchestration-bulk-orchestration
      draft PR #13 (lending and payments thread, 2026-10-08). Records keyed
      by fileId. The PR named the topics evt.pay.bulk.file-<event>.v1; the
      catalog rule (topic event = eventType event) makes them
      evt.pay.bulk.<event>.v1, as for evt.pay.rtp. The contract is to be PR'd
      into the asyncapi catalog by the service thread.
    # No consumers: confirmed by the service thread 2026-10-08.
    consumersStatus: unknown
    consumers: []
    topics:
      - {event: accepted, major: 1, eventType: Payments.BulkFile.Accepted.v1}
      - {event: completed, major: 1, eventType: Payments.BulkFile.Completed.v1}
      - {event: rejected, major: 1, eventType: Payments.BulkFile.Rejected.v1}

  - namespace: evt.cus.customer
    owner: svc-cus-profile-kyc
    aggregate: Customer
    contract: asyncapi/svc-cus-profile-kyc.yaml
    implementation: outbox-relay
    implementationEvidence: >-
      fintechbankx-customer-profile-kyc-core, customer-infrastructure
      CustomerEventEnvelopeFactory + OutboxRelay (Proposed branch, not merged).
    consumersStatus: unknown
    consumers: []
    topics:
      - {event: created, major: 1, eventType: Customer.Customer.Created.v1}
      - {event: contact-updated, major: 1, eventType: Customer.Customer.ContactUpdated.v1}
      - {event: credit-limit-updated, major: 1, eventType: Customer.Customer.CreditLimitUpdated.v1}
      - {event: credit-reserved, major: 1, eventType: Customer.Customer.CreditReserved.v1}
      - {event: credit-released, major: 1, eventType: Customer.Customer.CreditReleased.v1}
      - {event: credit-score-updated, major: 1, eventType: Customer.Customer.CreditScoreUpdated.v1}

  # Added on request of the risk/compliance thread. Their AsyncAPI contracts
  # are in asyncapi-catalog PR #11 (stacked on #10); eventTypes confirmed by
  # that thread on 2026-10-08. Neither service repository publishes these
  # events in code yet, so both namespaces are contract-only.
  - namespace: evt.rsk.risk
    owner: svc-rsk-decisioning
    aggregate: RiskAssessment
    contract: asyncapi/svc-rsk-decisioning.yaml
    implementation: contract-only
    implementationEvidence: >-
      Requested by the risk/compliance thread (asyncapi-catalog branch
      PR #11, branch claude/customer-risk-compliance-deployable-ygi0zo). No
      publisher in fintechbankx-riskcompliance-risk-decisioning-core.
    dlq:
      retentionMs: 1209600000   # 14 days
    consumersStatus: unknown
    consumers: []
    topics:
      - {event: assessed, major: 1, eventType: Risk.RiskAssessment.Assessed.v1}

  - namespace: evt.cmp.compliance
    owner: svc-cmp-evidence
    aggregate: ComplianceScreening
    contract: asyncapi/svc-cmp-evidence.yaml
    implementation: contract-only
    implementationEvidence: >-
      Requested by the risk/compliance thread (asyncapi-catalog branch
      PR #11, branch claude/customer-risk-compliance-deployable-ygi0zo). No
      publisher in fintechbankx-riskcompliance-compliance-evidence-core.
    dlq:
      retentionMs: 1209600000   # 14 days
    consumersStatus: unknown
    consumers: []
    topics:
      - {event: screened, major: 1, eventType: Compliance.ComplianceScreening.Screened.v1}

  # Open finance (confirmed by the open-finance service thread, 2026-10-08).
  # EventTypes, partitions and retention confirmed by the contracts in
  # asyncapi-catalog PR #12 (branch claude/openfinance-deployable-ra36dq),
  # which also declare the consent consumers via x-consumers.
  - namespace: evt.of.consent
    owner: svc-of-consent-authorization
    aggregate: Consent
    contract: asyncapi/svc-of-consent-authorization.yaml
    implementation: outbox-relay
    dlq:
      partitions: 6             # as in the contract
    implementationEvidence: >-
      Contract: asyncapi/svc-of-consent-authorization.yaml (asyncapi-catalog
      PR #12). Outbox relay in progress in the open-finance service thread; replaces
      the monolith Debezium outbox topic openfinance.provider.consent.v1.
      Not yet in code on the scanned branches.
    # Retention 90 days, delete: consent projections in the consumers rebuild
    # by replaying from earliest, so the topic must hold every consent still
    # alive. The thread asked for 30 days minimum, 90 preferred, or
    # compact+delete. compact+delete is the alternative if consents can live
    # longer than 90 days; it needs a per-topic exception to the
    # delete-only rule and a tombstone policy, so it is not used now.
    consumersStatus: known
    consumers:
      - service: svc-of-personal-financial-data
        group: cg.svc-of-personal-financial-data.consent-projection.v1
        topics: [evt.of.consent.created.v1, evt.of.consent.authorized.v1, evt.of.consent.revoked.v1, evt.of.consent.expired.v1]
        dlq: evt.of.account.dlq.v1
        evidence: Confirmed by the open-finance service thread (consent projection, in progress); not yet in code.
      - service: svc-of-business-financial-data
        group: cg.svc-of-business-financial-data.consent-projection.v1
        topics: [evt.of.consent.created.v1, evt.of.consent.authorized.v1, evt.of.consent.revoked.v1, evt.of.consent.expired.v1]
        dlq: evt.of.corporate.dlq.v1
        evidence: Confirmed by the open-finance service thread (consent projection, in progress); not yet in code.
      - service: svc-of-banking-metadata
        group: cg.svc-of-banking-metadata.consent-projection.v1
        topics: [evt.of.consent.created.v1, evt.of.consent.authorized.v1, evt.of.consent.revoked.v1, evt.of.consent.expired.v1]
        dlq: evt.of.metadata.dlq.v1
        evidence: Confirmed by the open-finance service thread (consent projection, in progress); not yet in code.
    topics:
      - {event: created, major: 1, eventType: OpenFinance.Consent.Created.v1, partitions: 6, retentionMs: 7776000000}
      - {event: authorized, major: 1, eventType: OpenFinance.Consent.Authorized.v1, partitions: 6, retentionMs: 7776000000}
      - {event: revoked, major: 1, eventType: OpenFinance.Consent.Revoked.v1, partitions: 6, retentionMs: 7776000000}
      - {event: expired, major: 1, eventType: OpenFinance.Consent.Expired.v1, partitions: 6, retentionMs: 7776000000}

  - namespace: evt.of.payee
    owner: svc-of-payee-verification
    aggregate: PayeeVerification
    contract: asyncapi/svc-of-payee-verification.yaml
    implementation: outbox-relay
    dlq:
      partitions: 6             # as in the contract
    implementationEvidence: >-
      Contract: asyncapi/svc-of-payee-verification.yaml (asyncapi-catalog PR
      #12). Outbox relay in progress in the open-finance service thread; not
      yet in code on the scanned branches.
    consumersStatus: unknown
    consumers: []
    topics:
      - {event: verification-completed, major: 1, eventType: OpenFinance.PayeeVerification.VerificationCompleted.v1, partitions: 6}

# Namespaces in the bootstrap manifest with no catalog topics, and producers
# that write to non-standard topics. Not provisioned; listed so the gap is visible.
gaps:
  - service: svc-pay-recurring-mandates
    namespace: evt.pay.mandate
    reason: >-
      Placeholder. Namespace and runtime identity confirmed (k8s namespace
      payments, service account payment-recurring-mandates-service); topic
      list pending from the service thread. No publisher in code yet.
  - service: svc-pay-request-to-pay
    namespace: rtp.pay_requests.v1 (legacy)
    reason: >-
      Legacy topic still written by KafkaPayRequestNotificationAdapter on
      main. To be retired once evt.pay.rtp.* is published through the outbox
      and the dual-publish criteria in TOPIC_NAMING_MIGRATION.md are met;
      kept under CREATE_LEGACY_TOPICS until then.
  - service: unassigned
    namespace: unassigned
    reason: >-
      Monolith Debezium outbox topics openfinance.provider.payment.v1,
      openfinance.provider.account-data.v1 (compacted) and the command topic
      openfinance.command.payment-execution.v1 with its retry/dlt topics have
      no owning fintechbankx service or contract yet. Needs an owner and an
      evt.of.* namespace before they move here. (openfinance.provider.consent.v1
      is covered by evt.of.consent.)
  - service: svc-of-personal-financial-data
    namespace: evt.of.account
    reason: >-
      No events published. Only its consumer DLQ evt.of.account.dlq.v1 is
      provisioned (consent projection).
  - service: svc-of-business-financial-data
    namespace: evt.of.corporate
    reason: >-
      No events published. Only its consumer DLQ evt.of.corporate.dlq.v1 is
      provisioned (consent projection).
  - service: svc-of-banking-metadata
    namespace: evt.of.metadata
    reason: >-
      No events published. Only its consumer DLQ evt.of.metadata.dlq.v1 is
      provisioned (consent projection).
  - service: svc-of-open-products-catalog
    namespace: evt.of.products
    reason: No publisher in code and no AsyncAPI contract.
  - service: svc-of-atm-directory
    namespace: evt.of.atm
    reason: No publisher in code and no AsyncAPI contract.
