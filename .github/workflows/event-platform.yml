name: Event Platform

# Catalog, topic script and manifest checks for the event-streaming platform.
# Validation only: nothing is applied to a cluster or an AWS account.

on:
  pull_request:
  push:
    branches: [main, dev, staging]

permissions:
  contents: read

jobs:
  catalog:
    name: event-platform/catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Unit tests and generated-file drift check
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Lint create-topics.sh
        run: shellcheck -S warning scripts/kafka/create-topics.sh

      - name: Dry-run topic creation from the catalog
        run: |
          set -euo pipefail
          DRY_RUN=true scripts/kafka/create-topics.sh
          DRY_RUN=true REPLICATION_FACTOR=1 MIN_INSYNC_REPLICAS=1 scripts/kafka/create-topics.sh >/dev/null

  manifests:
    name: event-platform/manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install kubeconform
        run: |
          set -euo pipefail
          # Runner architecture -> release asset name, with the sha256 of that asset from the
          # CHECKSUMS file of the kubeconform v0.6.7 release. Only that version is pinned: a
          # version bump must update these sums too, and any other version fails the step.
          if [ "$KUBECONFORM_VERSION" != "v0.6.7" ]; then
            echo "::error::no pinned sha256 for kubeconform ${KUBECONFORM_VERSION}; only v0.6.7 is pinned"
            exit 1
          fi
          case "$(uname -m)" in
            x86_64) arch=amd64; sha256=95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73 ;;
            aarch64) arch=arm64; sha256=dc82f79bb03c5479b1ae5fd4af221e4b5a3111f62bf01a2795d9c5c20fa96644 ;;
            *) echo "::error::no pinned kubeconform build for runner architecture $(uname -m)"; exit 1 ;;
          esac
          dl="$RUNNER_TEMP/kubeconform-dl"
          mkdir -p "$dl"
          curl -sSfL -o "$dl/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-${arch}.tar.gz"
          echo "${sha256}  $dl/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$dl/kubeconform.tar.gz" -C "$dl" kubeconform
          sudo install "$dl/kubeconform" /usr/local/bin/kubeconform

      - name: Render and validate Strimzi manifests (with and without Cruise Control)
        run: |
          set -euo pipefail
          schema='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          kubectl kustomize deploy/strimzi > "$RUNNER_TEMP/strimzi.yaml"
          kubeconform -strict -summary -schema-location default -schema-location "$schema" "$RUNNER_TEMP/strimzi.yaml"
          overlay="$RUNNER_TEMP/strimzi-cc"
          mkdir -p "$overlay"
          cp -r deploy/strimzi/. "$overlay/"
          printf 'components:\n  - optional/cruise-control\n' >> "$overlay/kustomization.yaml"
          kubectl kustomize "$overlay" > "$RUNNER_TEMP/strimzi-cc.yaml"
          kubeconform -strict -summary -schema-location default -schema-location "$schema" "$RUNNER_TEMP/strimzi-cc.yaml"

      - name: Validate local compose file
        run: docker compose -f deploy/local/docker-compose.yml config -q
