# In-cluster Kafka for non-AWS and local clusters. Render with
#   kubectl kustomize deploy/strimzi
# Requires the Strimzi cluster operator (0.47.0) watching namespace kafka.
# Optional Cruise Control: add `components: [optional/cruise-control]`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - generated/kafka-metrics-configmap.yaml
  - kafka-nodepools.yaml
  - kafka.yaml
  - generated/kafka-topics.yaml
  - generated/kafka-users.yaml
