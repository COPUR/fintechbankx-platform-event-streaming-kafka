# Generated by scripts/catalog/generate.mjs from topics/catalog.yaml. Do not edit; run `npm run catalog:generate`. Source rules: monitoring/jmx/kafka.yml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fintechbankx-kafka-metrics
  namespace: kafka
  labels:
    app.kubernetes.io/part-of: fintechbankx-event-streaming
    app.kubernetes.io/managed-by: topic-catalog
data:
  kafka-metrics-config.yml: |
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true
    rules:
      - pattern: "kafka.server<type=ReplicaManager, name=UnderReplicatedPartitions><>Value: (.*)"
        name: kafka_server_replicamanager_underreplicatedpartitions
        value: $1
        type: GAUGE
      - pattern: "kafka.server<type=ReplicaManager, name=UnderMinIsrPartitionCount><>Value: (.*)"
        name: kafka_server_replicamanager_underminisrpartitioncount
        value: $1
        type: GAUGE
      - pattern: "kafka.controller<type=KafkaController, name=OfflinePartitionsCount><>Value: (.*)"
        name: kafka_controller_offlinepartitionscount
        value: $1
        type: GAUGE
      - pattern: "kafka.server<type=BrokerTopicMetrics, name=(BytesInPerSec|BytesOutPerSec)><>Count: (.*)"
        name: kafka_server_brokertopicmetrics_$1_total
        value: $2
        type: COUNTER
      - pattern: "java.lang<type=Memory><HeapMemoryUsage>used: (.*)"
        name: kafka_jvm_heap_memory_used_bytes
        value: $1
        type: GAUGE
      - pattern: "kafka.controller<type=KafkaController, name=ActiveControllerCount><>Value: (.*)"
        name: kafka_controller_activecontrollercount
        value: $1
        type: GAUGE
      - pattern: "kafka.controller<type=ControllerStats, name=UncleanLeaderElectionsPerSec><>Count: (.*)"
        name: kafka_controller_uncleanleaderelections_total
        value: $1
        type: COUNTER
      - pattern: "kafka.server<type=ReplicaManager, name=(IsrShrinksPerSec|IsrExpandsPerSec)><>Count: (.*)"
        name: kafka_server_replicamanager_$1_total
        value: $2
        type: COUNTER
      - pattern: "kafka.server<type=ReplicaManager, name=(PartitionCount|LeaderCount)><>Value: (.*)"
        name: kafka_server_replicamanager_$1
        value: $2
        type: GAUGE
      - pattern: "kafka.server<type=KafkaRequestHandlerPool, name=RequestHandlerAvgIdlePercent><>OneMinuteRate: (.*)"
        name: kafka_server_kafkarequesthandlerpool_requesthandleravgidlepercent
        value: $1
        type: GAUGE
      - pattern: "kafka.server<type=BrokerTopicMetrics, name=MessagesInPerSec, topic=(.+)><>Count: (.*)"
        name: kafka_server_brokertopicmetrics_messagesin_total
        value: $2
        labels:
          topic: $1
        type: COUNTER
