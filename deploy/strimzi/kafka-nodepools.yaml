# KRaft node pools: three dedicated controllers and three brokers, one per
# availability zone (topologySpreadConstraints + rack awareness in kafka.yaml).
# Storage class is the cluster default; on clusters where it is not encrypted
# at rest, set spec.storage.volumes[].class to an encrypted class.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: controller
  namespace: kafka
  labels:
    strimzi.io/cluster: fintechbankx
    app.kubernetes.io/part-of: fintechbankx-event-streaming
spec:
  replicas: 3
  roles:
    - controller
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 20Gi
        deleteClaim: false
        kraftMetadata: shared
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 1Gi
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
  template:
    pod:
      metadata:
        annotations:
          sidecar.istio.io/inject: "false"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/cluster: fintechbankx
              strimzi.io/pool-name: controller
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/cluster: fintechbankx
              strimzi.io/pool-name: controller
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: broker
  namespace: kafka
  labels:
    strimzi.io/cluster: fintechbankx
    app.kubernetes.io/part-of: fintechbankx-event-streaming
spec:
  replicas: 3
  roles:
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 100Gi
        deleteClaim: false
        kraftMetadata: shared
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      memory: 4Gi
  jvmOptions:
    -Xms: 2g
    -Xmx: 2g
  template:
    pod:
      metadata:
        annotations:
          sidecar.istio.io/inject: "false"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/cluster: fintechbankx
              strimzi.io/pool-name: broker
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/cluster: fintechbankx
              strimzi.io/pool-name: broker
